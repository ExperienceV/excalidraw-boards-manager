[package]
name = "excalidraw-portfolios"
version = "0.1.0"
description = "A local portfolio and board manager powered by Excalidraw"
authors = ["Excalidraw Portfolio Manager"]
license = "MIT"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
libc = "0.2"
webkit2gtk = "2.0.2"
